    caption: 'The same report filtered to one quiz: work submitted through a token, an automated browser, AI agent traces in the page.'
  - path: .camp/screenshots/03-signal-legend.png
    caption: Every signal is explained, with what else can cause it.
  - path: .camp/screenshots/04-web-browser-only.png
