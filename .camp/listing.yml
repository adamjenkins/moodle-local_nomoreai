  - path: .camp/screenshots/05-site-dashboard.png
    caption: 'The site dashboard: signals per week and distinct users, to measure agent use in Detect only mode before enforcing.'
  - path: .camp/screenshots/06-dashboard-activities-agents.png
    caption: The activities with the most signals, and the agents that identified themselves.
  - path: .camp/screenshots/07-token-audit.png
    caption: 'The token audit: tokens students created for themselves (the Moodle app, an MCP tool), with a purge button.'
  - path: .camp/screenshots/08-admin-settings.png
    caption: 'Settings: the mode (Off, Detect only, Enforce) and trusted networks.'
